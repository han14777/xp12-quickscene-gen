name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: python -m pip install . pytest pyinstaller
      - name: Test
        run: python -m pytest -q
      - name: Build
        run: powershell -ExecutionPolicy Bypass -File packaging/build_release.ps1
      - name: Smoke test
        shell: pwsh
        run: |
          dist/QuickScene/QuickScene.exe --help
          if ($LASTEXITCODE -ne 0) { throw "QuickScene.exe --help failed" }
      - name: Publish release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $zip = Get-ChildItem dist/QuickScene-*-windows-x64.zip
          gh release create "${{ github.ref_name }}" $zip.FullName --title "${{ github.ref_name }}" --notes-file packaging/RELEASE_NOTES.md
