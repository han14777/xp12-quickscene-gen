# Global defaults. Code never hard-codes paths; everything is read from here.
# Machine paths (X-Plane, DSFTool) go in config/local.yaml (not in git; the GUI "Local settings" writes it),
# which overrides keys of the same name. A job's options (jobs/<name>/job.json) then override heights /
# classification and similar sections.

xplane:
  # When empty, read from %LOCALAPPDATA%/x-plane_install_12.txt (written by the X-Plane 12 installer)
  root: ""

tools:
  # DSFTool from XPTools (https://developer.x-plane.com/tools/xptools/). When empty, tools/DSFTool.exe is used,
  # downloaded from dsftool_url on first use
  dsftool: ""
  dsftool_url: "https://files.x-plane.com/public/xptools/xptools_win_24-5.zip"
  # SHA-256 of DSFTool.exe inside that zip; the download is rejected on mismatch (empty skips the check)
  dsftool_sha256: "42cacb1f988000b9d49b193438f1c79baa96dc35d29ed5a371d423e0650ffbf4"

paths:
  jobs_dir: "jobs"
  build_dir: "build"
  # Airport projects (airports/<ICAO>/airport.json) and caches (library index, converted textures)
  airports_dir: "airports"
  cache_dir: "cache"

osm:
  # One URL or a list of public mirrors, tried in turn when a server is busy (502 / 504) or fails
  overpass_url:
    - "https://overpass-api.de/api/interpreter"
    - "https://overpass.kumi.systems/api/interpreter"
    - "https://maps.mail.ru/osm/tools/overpass/api/interpreter"
    - "https://overpass.private.coffee/api/interpreter"
  # Buffer (metres) added to the area's bounding box for queries; the exact filter by centroid happens in clean
  bbox_buffer_m: 100
  # Large areas are queried in chunks on a lon/lat grid of this size (degrees) to avoid Overpass timeouts
  chunk_deg: 0.05
  request_timeout_s: 180
  # overpass-api.de often returns 502 / 504 in a row when busy. One round tries every mirror once; after a failed
  # round the wait grows (retry_backoff_s x round), up to max_retries rounds
  max_retries: 6
  retry_backoff_s: 30
  # Refuse areas larger than this (km²): Overpass load and DSF size get out of hand; split the area instead
  max_area_km2: 400

dsf:
  # Exclusions are tiled from rectangles: the area is covered with exclusion_cell_m squares, and cells at least
  # half inside are merged into rectangles. In XP12 polygon exclusions have no effect, rectangles do
  exclusion_cell_m: 10
  # Only default buildings are excluded (objects, facades); roads, polygons, lines and forests are kept
  exclusion_types: [obj, fac]
  # How far the generated buildings stay visible (km). Default facades draw up to their own LOD (lod_m below,
  # 8-18 km); past that, merged low-poly blocks (cityscene/impostors.py) take over up to this distance. Values at or
  # below a facade's LOD add nothing for it: default facades cannot be made to stop earlier
  render_distance_km: 30
  impostors:
    # Blocks are merged per cell_m grid cell; walls reach sink_m below ground; outlines simplified by simplify_m
    cell_m: 250
    sink_m: 10
    simplify_m: 1.5
    # Blocks appear this much before the facade disappears (facade distance is per building, block distance per
    # cell origin; half a 250 m cell diagonal is about 177 m)
    overlap_m: 200

install:
  # The pack's line in scenery_packs.ini goes before the first line containing any of these strings (tried in
  # order), or at the top if none matches. Exclusions only affect packs loaded later (lower in the file), so the
  # pack must sit above third-party autogen such as simHeaven
  insert_before: ["*GLOBAL_AIRPORTS*"]

# Trees from OSM (off by default). Single trees (natural=tree) and tree rows (natural=tree_row) use forests in
# point / line mode as WED does; woods (landuse=forest, natural=wood) become area forests. All are kept clearance_m
# away from the generated buildings and off drivable roads. Assets are X-Plane 12 default library paths
extras:
  trees: false
  tree_rows: false
  woods: false
  tree_asset: "lib/vegetation/trees/deciduous/maple_medium.for"
  tree_row_asset: "lib/vegetation/trees/deciduous/oak_medium.for"
  wood_asset: "lib/vegetation/forests/mixed/temperate.for"
  density: 255
  clearance_m: 2.0
  min_wood_m2: 200.0

heights:
  # Height priority: OSM height -> building:levels x level_height_m -> default
  default_height_m: 12.0
  # Small standalone structures without height data (kiosks, substations) below this footprint get a low default
  small_structure_max_area_m2: 100.0
  small_structure_height_m: 4.0
  level_height_m: 3.2
  max_valid_height_m: 350.0

clean:
  # Facades are extruded from the ground and cannot show elevated structures
  drop_building_values: ["roof", "bridge", "carport", "canopy"]
  drop_tags:
    amenity: ["shelter"]
    "tower:type": ["bridge", "communication"]
  min_area_m2: 10.0
  duplicate_iou: 0.9

roads:
  # Buildings are checked only against drivable roads; tunnels, covered ways, bridges and underground roads are not
  drivable: [motorway, motorway_link, trunk, trunk_link, primary, primary_link, secondary, secondary_link,
             tertiary, tertiary_link, unclassified, residential, living_street, service]
  ignore_service: [parking_aisle, driveway, drive-through]
  # Assumed carriageway half width (metres); most OSM roads have no width tag
  half_width_m: {motorway: 7, trunk: 6, primary: 6, secondary: 5, tertiary: 4, default: 3, service: 2}
  centerline_min_inside_m: 3.0
  on_road_share: 0.5

classification:
  high_rise_min_m: 60.0
  mid_rise_min_m: 20.0
  heritage_building_values: ["church", "cathedral", "chapel"]
  # Preferred facade styles per category, in order; if none fits the floor range, any style is used
  styles:
    high_rise: ["glass", "modern", "universal"]
    mid_rise: ["modern", "classic"]
    low_rise: ["modern", "classic"]
    heritage: ["classic"]
  # Floor height (metres) assumed when converting height to floors
  facade_floor_height_m: 3.5

# X-Plane 12 default generic facades (12.4.4, taken from Resources/default scenery/1000 autogen/library.txt and the
# FLOORS_MIN / FLOORS_MAX and LOD of each .fac; floors_max null means unlimited; lod_m is the facade's draw distance). FLOORS_MIN/MAX make X-Plane cut or raise
# a building to fit, so pick a facade whose range covers the floor count.
# Known gap: there is no 1-floor generic facade, so 1-2 storey buildings are drawn with at least 2 floors
facades:
  - {path: "lib/buildings/facades/generic/high_glass_01.fac", style: glass, floors_min: 3, floors_max: null, lod_m: 10000}
  - {path: "lib/buildings/facades/generic/high_glass_02.fac", style: glass, floors_min: 3, floors_max: 32, lod_m: 15000}
  - {path: "lib/buildings/facades/generic/high_glass_03.fac", style: glass, floors_min: 3, floors_max: 32, lod_m: 15000}
  - {path: "lib/buildings/facades/generic/high_metallic_01.fac", style: glass, floors_min: 3, floors_max: 30, lod_m: 15000}
  - {path: "lib/buildings/facades/generic/high_modern_01.fac", style: modern, floors_min: 3, floors_max: null, lod_m: 15000}
  - {path: "lib/buildings/facades/generic/high_modern_02.fac", style: modern, floors_min: 3, floors_max: null, lod_m: 10000}
  - {path: "lib/buildings/facades/generic/high_modern_03.fac", style: modern, floors_min: 3, floors_max: 31, lod_m: 15000}
  - {path: "lib/buildings/facades/generic/high_modern_04.fac", style: modern, floors_min: 3, floors_max: 31, lod_m: 15000}
  - {path: "lib/buildings/facades/generic/high_modern_05.fac", style: modern, floors_min: 3, floors_max: 34, lod_m: 15000}
  - {path: "lib/buildings/facades/generic/high_modern_06.fac", style: modern, floors_min: 3, floors_max: 31, lod_m: 15000}
  - {path: "lib/buildings/facades/generic/high_modern_07.fac", style: modern, floors_min: 3, floors_max: 33, lod_m: 15000}
  - {path: "lib/buildings/facades/generic/mid_modern_01.fac", style: modern, floors_min: 3, floors_max: 8, lod_m: 10000}
  - {path: "lib/buildings/facades/generic/mid_modern_02.fac", style: modern, floors_min: 3, floors_max: 7, lod_m: 10000}
  - {path: "lib/buildings/facades/generic/mid_modern_03.fac", style: modern, floors_min: 3, floors_max: 9, lod_m: 10000}
  - {path: "lib/buildings/facades/generic/mid_modern_04.fac", style: modern, floors_min: 3, floors_max: 13, lod_m: 10000}
  - {path: "lib/buildings/facades/generic/mid_modern_05.fac", style: modern, floors_min: 3, floors_max: 13, lod_m: 10000}
  - {path: "lib/buildings/facades/generic/low_modern_01.fac", style: modern, floors_min: 2, floors_max: 2, lod_m: 8000}
  - {path: "lib/buildings/facades/generic/high_universal_01.fac", style: universal, floors_min: 4, floors_max: 60, lod_m: 18000}
  - {path: "lib/buildings/facades/generic/high_universal_02.fac", style: universal, floors_min: 4, floors_max: 60, lod_m: 18000}
  - {path: "lib/buildings/facades/generic/high_classic_01.fac", style: classic, floors_min: 6, floors_max: 12, lod_m: 15000}
  - {path: "lib/buildings/facades/generic/high_classic_02.fac", style: classic, floors_min: 3, floors_max: null, lod_m: 15000}
  - {path: "lib/buildings/facades/generic/mid_classic_01.fac", style: classic, floors_min: 3, floors_max: 10, lod_m: 10000}
  - {path: "lib/buildings/facades/generic/mid_classic_02.fac", style: classic, floors_min: 3, floors_max: 9, lod_m: 10000}
