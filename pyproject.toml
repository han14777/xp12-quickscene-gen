[project]
name = "xp12-cityscene-gen"
version = "0.1.1"
description = "Quick X-Plane 12 city scenery from OpenStreetMap (OSM -> facade DSF), with a browser map UI"
requires-python = ">=3.11"
license = { text = "GPL-3.0-or-later" }
authors = [{ name = "Hanyi Zhang" }]
dependencies = [
    "pyyaml>=6.0",
    "requests>=2.31",
    "shapely>=2.0",
    "pyproj>=3.6",
    "osmium>=4.0",
    "pillow>=10.0",
    "numpy>=1.24",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
cityscene = "cityscene.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["cityscene*"]

[tool.setuptools.package-data]
cityscene = ["gui/static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
